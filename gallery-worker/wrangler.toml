name = "cullback"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# R2 bucket — created originally as `photo-gallery`. Bucket names are
# account-internal (never appear in public URLs), so renaming would
# require copying every existing photo across to a new bucket. Left as-is.
[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "photo-gallery"

# KV namespace — create with: wrangler kv namespace create GALLERY_KV
# Then paste the returned id here.
[[kv_namespaces]]
binding = "GALLERY_KV"
id = "12b8ba67ba60403c95ddf44ccf1f4c01"

# Set with: wrangler secret put ADMIN_TOKEN
# (paired with the same value in the photo app's settings)
#
# Email notification (model taps 確認完了) goes through SendGrid. All three
# of these are also `wrangler secret put` secrets — leave them unset on
# preview/dev to no-op the email send (the /done endpoint returns
# {ok:true,skipped:true} instead of 500ing):
#   wrangler secret put SENDGRID_API_KEY    # SG.xxxxx (must allow mail.send)
#   wrangler secret put SENDGRID_FROM       # verified sender, e.g. noreply@yourdomain
#   wrangler secret put PHOTOGRAPHER_EMAIL  # where notifications land
[vars]
# ADMIN_TOKEN / SENDGRID_* / PHOTOGRAPHER_EMAIL are intentionally NOT [vars]
# entries — use `wrangler secret put`.
